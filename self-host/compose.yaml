services:
  airhockey:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    user: node
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GAME_PORT:-8787}:8787"
    volumes:
      - ./:/app:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
